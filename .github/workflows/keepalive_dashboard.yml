name: Keepalive Dashboard

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Playwright
        run: pip install playwright && playwright install chromium --with-deps

      - name: Despertar app Streamlit
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python3 - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          URL = os.environ["STREAMLIT_APP_URL"]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print(f"Abriendo {URL}...")
              page.goto(URL, timeout=60000)

              # Si la app está dormida, clickear el botón de despertar
              try:
                  page.click("text=Yes, get this app back up!", timeout=8000)
                  print("App estaba dormida — botón de despertar clickeado.")
                  page.wait_for_timeout(15000)
              except Exception:
                  print("App ya estaba activa.")

              page.wait_for_timeout(5000)
              print("Keepalive completado.")
              browser.close()
          EOF

      - name: Reportar fallo
        if: failure()
        run: |
          echo "::error::El keepalive del dashboard falló. La app puede estar dormida."
          echo "Revisar: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
