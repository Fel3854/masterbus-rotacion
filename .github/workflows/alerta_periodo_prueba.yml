name: Alerta Período de Prueba

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 Argentina (UTC-3) todos los días
  workflow_dispatch:         # permite dispararlo manualmente desde GitHub

jobs:
  alerta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Restaurar registro de notificados
        uses: actions/cache@v4
        with:
          path: datos/alerta_periodo_prueba/notificados.json
          key: notificados-${{ github.run_id }}
          restore-keys: |
            notificados-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r datos/alerta_periodo_prueba/requirements.txt

      - name: Ejecutar tests
        run: pytest datos/alerta_periodo_prueba/tests/ -v

      - name: Ejecutar alerta
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALERTA_DIA_MIN: "150"
          ALERTA_DIA_MAX: "180"
        run: python3 datos/alerta_periodo_prueba/main.py

      - name: Notificar fallo
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import smtplib, os
          from email.mime.text import MIMEText
          host = os.environ["SMTP_HOST"]
          port = int(os.environ.get("SMTP_PORT", "587"))
          user = os.environ["SMTP_USER"]
          pwd  = os.environ["SMTP_PASSWORD"]
          msg = MIMEText(
              "El workflow 'Alerta Período de Prueba' falló.\n\n"
              "Revisar en: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          msg["Subject"] = "[MasterBus] Workflow fallido: Alerta Período de Prueba"
          msg["From"] = user
          msg["To"]   = user
          with smtplib.SMTP(host, port) as s:
              s.starttls()
              s.login(user, pwd)
              s.send_message(msg)
          print("Notificación de fallo enviada.")
          EOF
